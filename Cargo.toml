[package]
name = "nanomc-launcher"
version = "1.1.0"
edition = "2021"
description = "A native Rust launcher for NanoMC Reworked 1.12.2"
build = "build.rs"

[dependencies]
eframe = "0.31"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
